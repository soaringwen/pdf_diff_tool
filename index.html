<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Diff — PDF 差异对比工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="8" height="18" rx="2" fill="#6366f1"/>
        <rect x="13" y="3" width="8" height="18" rx="2" fill="#a5b4fc"/>
        <path d="M6 9h2M6 13h2M16 9h2M16 13h2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>PDF Diff <em>文档差异对比</em></span>
    </div>
    <div class="header-tip">所有解析与对比均在浏览器本地完成，文件不会上传到任何服务器</div>
  </header>

  <main>
    <!-- 上传区域 -->
    <section class="upload-panel" id="uploadPanel">
      <div class="drop-zone" id="dropA">
        <input type="file" accept="application/pdf" hidden id="fileA" />
        <div class="dz-empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
            <path d="M12 16V4m0 0L8 8m4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round"/>
          </svg>
          <p class="dz-title">原文件（旧版本）</p>
          <p class="dz-sub">点击选择或拖拽 PDF 到此处</p>
        </div>
        <div class="dz-file hidden">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.6">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/>
            <path d="M14 3v5h5" stroke-linejoin="round"/>
          </svg>
          <div class="dz-meta">
            <p class="dz-name"></p>
            <p class="dz-info"></p>
          </div>
          <button class="dz-clear" title="移除文件">&times;</button>
        </div>
      </div>

      <div class="vs-badge">VS</div>

      <div class="drop-zone" id="dropB">
        <input type="file" accept="application/pdf" hidden id="fileB" />
        <div class="dz-empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
            <path d="M12 16V4m0 0L8 8m4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round"/>
          </svg>
          <p class="dz-title">对比文件（新版本）</p>
          <p class="dz-sub">点击选择或拖拽 PDF 到此处</p>
        </div>
        <div class="dz-file hidden">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.6">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/>
            <path d="M14 3v5h5" stroke-linejoin="round"/>
          </svg>
          <div class="dz-meta">
            <p class="dz-name"></p>
            <p class="dz-info"></p>
          </div>
          <button class="dz-clear" title="移除文件">&times;</button>
        </div>
      </div>

      <div class="upload-actions">
        <button id="compareBtn" class="btn-primary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3H5a2 2 0 0 0-2 2v4m0 6v4a2 2 0 0 0 2 2h4m6-18h4a2 2 0 0 1 2 2v4m0 6v4a2 2 0 0 1-2 2h-4" stroke-linecap="round"/>
          </svg>
          开始对比
        </button>
        <label class="opt-check"><input type="checkbox" id="ignoreSpace" /> 忽略空白与空行差异</label>
      </div>
    </section>

    <!-- 工具栏 -->
    <section class="toolbar hidden" id="toolbar">
      <div class="view-toggle">
        <button class="vt-btn active" data-view="side">左右对照</button>
        <button class="vt-btn" data-view="unified">合并视图</button>
      </div>
      <div class="stats" id="stats"></div>
      <button id="exportBtn" class="export-btn" title="导出差异报告（可用于大模型分析）">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round"/>
        </svg>
        导出差异报告
      </button>
      <div class="diff-nav">
        <button id="prevDiff" class="nav-btn" title="上一个差异">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="diffPos" class="diff-pos">0 / 0</span>
        <button id="nextDiff" class="nav-btn" title="下一个差异">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <!-- 结果区域 -->
    <section class="result hidden" id="result">
      <div id="sideView" class="diff-wrap">
        <div class="col-heads">
          <div class="col-head head-a" id="headA">原文件</div>
          <div class="col-head head-b" id="headB">对比文件</div>
        </div>
        <div class="diff-scroll">
          <div class="diff-grid" id="sideGrid"></div>
        </div>
      </div>
      <div id="unifiedView" class="diff-wrap hidden">
        <div class="diff-scroll">
          <div class="unified-list" id="unifiedList"></div>
        </div>
      </div>
      <div class="empty-state hidden" id="emptyState"></div>
    </section>
  </main>

  <!-- 加载遮罩 -->
  <div class="overlay hidden" id="overlay">
    <div class="spinner"></div>
    <p id="overlayText">正在解析 PDF…</p>
  </div>

  <div class="toast hidden" id="toast"></div>

  <!-- 导出报告弹窗 -->
  <div class="modal hidden" id="exportModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>导出差异报告</h3>
        <button id="exportClose" class="modal-close" title="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-tip">以下报告为结构化 Markdown 格式，可直接复制或下载后发送给大模型（如 GLM、GPT 等）进行差异分析。</p>
        <label class="modal-opt">
          <input type="checkbox" id="includePrompt" checked />
          附带大模型分析指令（Prompt）
        </label>
        <textarea id="exportText" readonly spellcheck="false"></textarea>
        <div class="modal-foot">
          <button id="downloadExport" class="btn-mini">下载 .md 文件</button>
          <button id="copyExport" class="btn-mini primary">复制全文</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
